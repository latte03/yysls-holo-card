<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#16181a"
    />
    <!-- 用户显式选过深浅时，这条同步脚本先把 color-scheme 写到 <html> 上，免得首屏先闪一
         帧另一套方案（跟随系统那一态完全由 CSS 的 light-dark() 决定，不需要这里参与）。
         配色方案本身在 style.css 的 token 里，这里只搬那一次选择。 -->
    <script>
      try {
        var t = localStorage.getItem("holo-theme");
        if (t) document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <title>燕云十六声 · 典藏闪卡</title>
    <link rel="stylesheet" href="/viewer/style.css" />
    <script type="module" src="/viewer/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="../index.html" aria-label="燕云十六声 · 典藏闪卡首页"
        ><img
          class="wordmark-logo logo-ink"
          src="/assets/logo-ink.png"
          alt="燕云十六声 WHERE WINDS MEET"
          width="300"
          height="96"
        /><img
          class="wordmark-logo logo-light"
          src="/assets/logo-light.png"
          alt="燕云十六声 WHERE WINDS MEET"
          width="300"
          height="96"
      /></a>
      <nav class="collection-label" aria-label="典藏闪卡卡序" data-card-nav></nav>
      <div class="header-actions">
        <button
          class="icon-button"
          id="info"
          aria-label="作品信息"
          title="作品信息"
          disabled
        >
          <i data-lucide="info"></i>
        </button>
        <button
          class="icon-button"
          id="theme"
          type="button"
          aria-label="切换到深色"
          title="切换到深色"
        >
          <!-- 图标 / aria-label / title 由 viewer/theme.js 按当前方案改写，
               这里的初值只是 JS 未就绪时的样子。 -->
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>
    <main>
      <section class="gallery" aria-label="卡片展台">
        <div
          class="stage"
          id="stage"
          tabindex="0"
          role="group"
          aria-label="可旋转的全息卡片"
        >
          <div id="loading" class="loading" role="status">
            <span class="loading-line"></span><span>正在装裱作品</span>
          </div>
        </div>
        <div
          class="parameter-panel"
          id="parameter-panel"
          hidden
        >
          <div class="panel-heading">
            <span>景深与构图</span>
          </div>
          <label class="range-row" for="scale"
            ><span>画面比例</span><output id="scale-value"></output
            ><input id="scale" type="range" min="0.95" max="1.35" step="0.01"
          /></label>
          <label class="range-row" for="depth"
            ><span>画面景深</span><output id="depth-value"></output
            ><input id="depth" type="range" min="-0.6" max="0.9" step="0.01"
          /></label>
          <label class="range-row" for="fx-depth"
            ><span>特效景深</span><output id="fx-depth-value"></output
            ><input id="fx-depth" type="range" min="-0.3" max="0.9" step="0.01"
          /></label>
          <label class="range-row" for="bg-depth"
            ><span>底纹景深</span><output id="bg-depth-value"></output
            ><input id="bg-depth" type="range" min="-0.6" max="0.4" step="0.01"
          /></label>
          <!-- 主体只有一张的卡（没声明 subjectLayers）用不到下面这排 tab 和三组滑杆，
               app.js 会把它们继续留在 hidden；多层卡则反过来把上面的「画面景深」藏掉——
               那一行管的就是中层，和「中层 · 景深」是同一根滑杆，不能同时出现两个。 -->
          <div class="layer-tabs" role="tablist" aria-label="主体层" hidden>
            <button
              class="layer-tab"
              type="button"
              role="tab"
              data-layer="back"
              aria-selected="false"
              disabled
            >
              后层
            </button>
            <button
              class="layer-tab"
              type="button"
              role="tab"
              data-layer="mid"
              aria-selected="true"
              disabled
            >
              中层 · 人物
            </button>
            <button
              class="layer-tab"
              type="button"
              role="tab"
              data-layer="front"
              aria-selected="false"
              disabled
            >
              前层
            </button>
          </div>
          <div class="layer-group" data-layer="back" role="tabpanel" hidden>
            <label class="range-row" for="back-size"
              ><span>大小</span><output id="back-size-value"></output
              ><input id="back-size" type="range" min="0.85" max="1.15" step="0.01"
                disabled
            /></label>
            <label class="range-row" for="back-x"
              ><span>左右</span><output id="back-x-value"></output
              ><input id="back-x" type="range" min="-0.08" max="0.08" step="0.002"
                disabled
            /></label>
            <label class="range-row" for="back-y"
              ><span>上下</span><output id="back-y-value"></output
              ><input id="back-y" type="range" min="-0.08" max="0.08" step="0.002"
                disabled
            /></label>
            <label class="range-row" for="back-depth"
              ><span>景深</span><output id="back-depth-value"></output
              ><input id="back-depth" type="range" min="-0.8" max="2" step="0.01"
                disabled
            /></label>
          </div>
          <div class="layer-group" data-layer="mid" role="tabpanel" hidden>
            <label class="range-row" for="mid-size"
              ><span>大小</span><output id="mid-size-value"></output
              ><input id="mid-size" type="range" min="0.85" max="1.15" step="0.01"
                disabled
            /></label>
            <label class="range-row" for="mid-x"
              ><span>左右</span><output id="mid-x-value"></output
              ><input id="mid-x" type="range" min="-0.08" max="0.08" step="0.002"
                disabled
            /></label>
            <label class="range-row" for="mid-y"
              ><span>上下</span><output id="mid-y-value"></output
              ><input id="mid-y" type="range" min="-0.08" max="0.08" step="0.002"
                disabled
            /></label>
            <label class="range-row" for="mid-depth"
              ><span>景深</span><output id="mid-depth-value"></output
              ><input id="mid-depth" type="range" min="-0.8" max="2" step="0.01"
                disabled
            /></label>
          </div>
          <div class="layer-group" data-layer="front" role="tabpanel" hidden>
            <label class="range-row" for="front-size"
              ><span>大小</span><output id="front-size-value"></output
              ><input id="front-size" type="range" min="0.85" max="1.15" step="0.01"
                disabled
            /></label>
            <label class="range-row" for="front-x"
              ><span>左右</span><output id="front-x-value"></output
              ><input id="front-x" type="range" min="-0.08" max="0.08" step="0.002"
                disabled
            /></label>
            <label class="range-row" for="front-y"
              ><span>上下</span><output id="front-y-value"></output
              ><input id="front-y" type="range" min="-0.08" max="0.08" step="0.002"
                disabled
            /></label>
            <label class="range-row" for="front-depth"
              ><span>景深</span><output id="front-depth-value"></output
              ><input id="front-depth" type="range" min="-0.8" max="2" step="0.01"
                disabled
            /></label>
          </div>
        </div>
      </section>
      <section class="artwork-bar" aria-label="作品与材质">
        <div class="artwork-title">
          <div class="title-line">
            <h1 id="card-title">BOND</h1>
            <span id="subtitle">共生</span>
          </div>
          <p id="description">光与影，彼此相依。</p>
        </div>
        <div class="bar-center">
          <div class="face-picker" role="group" aria-label="卡片朝向">
            <button id="front" aria-pressed="true" disabled>正面</button
            ><button id="back" aria-pressed="false" disabled>背面</button>
          </div>
          <!-- 图标与 aria 标签由 setAuto() 按状态换成 play/pause；这里的初值只为 JS 未就绪时不空。 -->
          <button
            id="auto"
            class="auto-toggle"
            type="button"
            aria-pressed="false"
            aria-label="自动旋转"
            title="自动旋转"
            disabled
          >
            <i data-lucide="play"></i>
          </button>
          <button
            class="icon-button save-button"
            id="save"
            aria-label="保存卡片图片"
            title="保存卡片图片"
            disabled
          >
            <i data-lucide="download"></i>
          </button>
        </div>
        <div class="finish-cluster">
          <div class="finish-control">
          <div class="finish-heading">
            <span>卡面质感</span>
            <div class="swatches" role="group" aria-label="卡面材质">
              <!-- 色板由 viewer/app.js 的 renderFinishSwatches() 按 site/finishes.js 渲染 -->
            </div>
            <span id="finish-name">珠光</span>
          </div>
          <label class="foil-row" for="foil"
            ><span>光泽</span
            ><input
              id="foil"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.52"
              disabled
            /><output id="foil-value">52%</output></label
          >
          <label class="foil-row" for="foil-sat" data-webgl-only
            ><span>鲜艳</span
            ><input
              id="foil-sat"
              type="range"
              min="0.6"
              max="2"
              step="0.05"
              value="1.35"
              disabled
            /><output id="foil-sat-value">135%</output></label
          >
          <label class="foil-row" for="sweep-soft" data-webgl-only
            ><span>扫光</span
            ><input
              id="sweep-soft"
              type="range"
              min="4"
              max="14"
              step="0.5"
              value="7"
              disabled
            /><output id="sweep-soft-value">7.00</output></label
          >
          </div>
          <button
            id="depth-toggle"
            class="depth-toggle"
            type="button"
            aria-controls="parameter-panel"
            aria-expanded="false"
            aria-label="显示或隐藏景深调整"
            title="显示或隐藏景深调整"
          >
            <i data-lucide="sliders-horizontal"></i><span>景深调整</span>
          </button>
        </div>
      </section>
    </main>
    <footer class="footer">
      <span>光随手动，画有余深。</span><span>DESIGNED TO BE SEEN IN MOTION</span>
    </footer>
    <dialog id="about" aria-labelledby="about-title">
      <button
        id="close-about"
        class="icon-button modal-close"
        aria-label="关闭作品信息"
        title="关闭作品信息"
      >
        <i data-lucide="x"></i>
      </button>
      <p class="dialog-mark">
        <img
          class="logo-ink"
          src="/assets/logo-ink.png"
          alt="燕云十六声 WHERE WINDS MEET"
          width="300"
          height="96"
        /><img
          class="logo-light"
          src="/assets/logo-light.png"
          alt="燕云十六声 WHERE WINDS MEET"
          width="300"
          height="96"
        />
      </p>
      <h2 id="about-title">共生 / BOND</h2>
      <p id="about-description"></p>
      <dl>
        <div>
          <dt>来源</dt>
          <dd>燕云十六声典藏系列 · 外部生图交付</dd>
        </div>
        <div>
          <dt>呈现</dt>
          <dd>多层镭射收藏卡 · 实时网页呈现</dd>
        </div>
        <div>
          <dt>编号</dt>
          <dd id="about-edition">No.001</dd>
        </div>
      </dl>
    </dialog>
    <div id="notice" role="status" class="notice" hidden></div>
    <script type="module" src="/viewer/app.js"></script>
  </body>
</html>
